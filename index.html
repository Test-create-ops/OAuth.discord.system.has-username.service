<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Profile CDN</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #0b0d12; color: #fff; }
    .card { width: min(560px, calc(100% - 32px)); padding: 32px; border: 1px solid #252a35; border-radius: 20px; background: #11151d; box-shadow: 0 20px 60px #0008; }
    h1 { margin-top: 0; }
    button { border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 700; cursor: pointer; background: #5865f2; color: white; }
    button:hover { background: #4752c4; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 16px; border-radius: 12px; background: #090b10; color: #cfd5e1; }
    .muted { color: #9aa3b2; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Discord Profile CDN</h1>
    <p class="muted">Autenticati con Discord per leggere username, ID e avatar hash.</p>
    <button id="login">Accedi con Discord</button>
    <pre id="output">Nessun utente autenticato.</pre>
  </main>
  <script>
    // Imposta qui il Client ID della tua Discord Application.
    const CLIENT_ID = 'INSERISCI_CLIENT_ID';
    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const SCOPES = 'identify';

    document.querySelector('#login').addEventListener('click', () => {
      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        response_type: 'token',
        redirect_uri: REDIRECT_URI,
        scope: SCOPES
      });
      window.location.href = 'https://discord.com/oauth2/authorize?' + params;
    });

    async function loadUser() {
      const hash = new URLSearchParams(window.location.hash.slice(1));
      const accessToken = hash.get('access_token');
      if (!accessToken) return;

      try {
        const response = await fetch('https://discord.com/api/v10/users/@me', {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        if (!response.ok) throw new Error(`Discord API: ${response.status}`);
        const user = await response.json();

        let avatarUrl = 'Avatar predefinito Discord';
        if (user.avatar) {
          const extension = user.avatar.startsWith('a_') ? 'gif' : 'png';
          avatarUrl = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${extension}`;
        }

        document.querySelector('#output').textContent = JSON.stringify({
          username: user.username,
          global_name: user.global_name,
          id: user.id,
          avatar_hash: user.avatar,
          avatar_cdn: avatarUrl
        }, null, 2);

        history.replaceState(null, '', window.location.pathname);
      } catch (error) {
        document.querySelector('#output').textContent = 'Errore: ' + error.message;
      }
    }

    loadUser();
  </script>
</body>
</html>
